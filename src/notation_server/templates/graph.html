<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>notation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/static/app.css">
  <style>{{ highlight_css }}</style>
  <script id="config" type="application/json">{{ config | tojson }}</script>
  <script src="https://unpkg.com/3d-force-graph@1.80.2/dist/3d-force-graph.min.js"></script>
  <!-- Cytoscape draws the note panel's graph of neighbours. -->
  <script src="https://unpkg.com/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
  <script src="https://unpkg.com/htmx.org@2.0.3/dist/htmx.min.js"></script>
  <script src="/static/app.js" defer></script>
</head>
<body hx-headers='{"{{ token_header }}": "{{ token }}"}'>
  <main>
    <section id="graph-pane">
      <div id="controls">
        <div id="toolbar">
          <span class="search-box">
            <input id="search" type="search" autocomplete="off" spellcheck="false"
                   role="combobox" aria-autocomplete="list" aria-controls="suggest" aria-expanded="false"
                   placeholder="words  #tag  -#tag  ~#tag  2026..  ..202609"
                   title="words · highlight notes whose title, aliases or id contain them all, in any order
#tag · only notes with this tag
-#tag · hide notes with this tag
~#tag · collapse notes with this tag into one node
Folders are tags ending in /, e.g. -#journal/
A..B · only notes created in a range of id beginnings (YYYYMMDDhhmmss), either end open:
2026.. · from 2026 on
..202609 · up to the end of September 2026
20260901..20260930 · 1 to 30 September 2026">
            <ul id="suggest" role="listbox" aria-label="Tags" hidden></ul>
          </span>
          <label>Show
            <select id="depth">
              <option value="0">all notes</option>
              <option value="1">1 hop</option>
              <option value="2">2 hops</option>
              <option value="3">3 hops</option>
            </select>
          </label>
          <label><input id="hide-isolated" type="checkbox" checked> Hide unlinked</label>
          <label title="Pull notes of the same colour together"><input id="cluster" type="checkbox"> Cluster by colour</label>
          <label title="Show each note's title next to it"><input id="titles" type="checkbox"> Titles</label>
          <label title="Fly through the graph: W/S forward and back, A/D left and right, R/F up and down, arrow keys to turn, Q/E to roll, Shift to go slower; drag the mouse to look around"><input id="fly" type="checkbox"> Fly</label>
          <span id="stats"></span>
        </div>
        <div id="legend" role="group"
             aria-label="Colour legend: click a tag to hide or show its notes, shift-click to collapse or expand them"></div>
      </div>
      <div id="views">
        <div id="graph" class="graph" role="img"
             aria-label="Graph of linked notes. Drag to rotate, scroll to zoom, right-drag to pan."></div>
        <div id="problems" hidden></div>
      </div>
    </section>
    <div id="splitter" role="separator" aria-orientation="vertical" aria-label="Resize note panel" tabindex="0"></div>
    <aside id="panel">
      <p class="muted">Click a note in the graph to view it.</p>
    </aside>
  </main>
  <div id="toast" role="status" hidden></div>
</body>
</html>
