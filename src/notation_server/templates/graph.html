<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>notation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/static/app.css">
  <style>{{ highlight_css }}</style>
  <script id="config" type="application/json">{{ config | tojson }}</script>
  <script src="https://unpkg.com/3d-force-graph@1.80.2/dist/3d-force-graph.min.js"></script>
  <!-- Cytoscape draws the note panel's graph of neighbours. -->
  <script src="https://unpkg.com/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
  <script src="https://unpkg.com/htmx.org@2.0.3/dist/htmx.min.js"></script>
  <script src="/static/app.js" defer></script>
</head>
<body hx-headers='{"{{ token_header }}": "{{ token }}"}'>
  <main>
    <section id="graph-pane">
      <div id="controls">
        <div id="toolbar">
          <input id="search" type="search" autocomplete="off" spellcheck="false"
                 placeholder="Search titles, aliases, ids · dates: 2026..  ..202609"
                 title="Words, in any order, highlight notes whose title, aliases or id contain them all; ids start with the creation time, so 2026 or 202609 finds notes from then.
A range of id beginnings keeps only the notes created in it (both ends included, either open):
2026.. · from 2026 on
..202609 · up to the end of September 2026
20260901..20260930 · 1 to 30 September 2026">
          <label>Colour by
            <select id="colour-by">
              <option value="tag">tag</option>
              <option value="subdir">folder</option>
            </select>
          </label>
          <label>Show
            <select id="depth">
              <option value="0">all notes</option>
              <option value="1">1 hop</option>
              <option value="2">2 hops</option>
              <option value="3">3 hops</option>
            </select>
          </label>
          <label><input id="hide-isolated" type="checkbox" checked> Hide unlinked</label>
          <label title="Collapse or expand a group with the button on its legend entry"><input id="group" type="checkbox"> Group by colour</label>
          <span id="stats"></span>
        </div>
        <div id="legend" role="group" aria-label="Colour legend: click an entry to show or hide its notes"></div>
      </div>
      <div id="views">
        <div id="graph" class="graph" role="img"
             aria-label="Graph of linked notes. Drag to rotate, scroll to zoom, right-drag to pan."></div>
        <div id="problems" hidden></div>
      </div>
    </section>
    <div id="splitter" role="separator" aria-orientation="vertical" aria-label="Resize note panel" tabindex="0"></div>
    <aside id="panel">
      <p class="muted">Click a note in the graph to view it.</p>
    </aside>
  </main>
  <div id="toast" role="status" hidden></div>
</body>
</html>
