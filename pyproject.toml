[project]
name = "notation-server"
version = "0.1.0"
description = "Browse a notation note tree as an interactive graph of linked notes"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "watchfiles>=0.21",
    "pygments>=2.17",
]

[project.optional-dependencies]
# Render .ipynb notes as HTML; without it they are shown as highlighted JSON.
ipynb = ["nbconvert>=7"]

[project.scripts]
notation-server = "notation_server.cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notation_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
